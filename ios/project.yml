name: MaculaCam2Me
options:
  bundleIdPrefix: io.macula
  deploymentTarget:
    iOS: "17.0"

targets:
  MaculaCam2Me:
    type: application
    platform: iOS
    sources: MaculaCam2Me
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.macula.cam2me
        SWIFT_VERSION: "5.0"
        # Modern auto-generated Info.plist (Xcode 13+'s own "New
        # Project" default) -- INFOPLIST_KEY_* only takes effect once
        # this is on. Without it, xcodebuild expects a physical
        # Info.plist file that doesn't exist here and fails outright.
        GENERATE_INFOPLIST_FILE: YES
        # Camera capture (NSCameraUsageDescription, AVFoundation) is a
        # feature-phase addition, not part of this skeleton.
        INFOPLIST_KEY_UILaunchScreen_Generation: true
    dependencies:
      # Built by ../scripts/build-rust-ios.sh (cargo build --target
      # aarch64-apple-ios[-sim] + xcodebuild -create-xcframework). Not
      # committed -- a build artifact, regenerated locally or in CI
      # before this target ever compiles, same as the Kotlin side's
      # jniLibs.
      - framework: MaculaRustSdkFFI.xcframework
        embed: true
        codeSign: true
