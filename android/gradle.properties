org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# Opt out of AGP 9's built-in Kotlin -- see build.gradle.kts's comment
# on why: Room's KSP processor needs an exact Kotlin version match,
# and built-in Kotlin's exact bundled version isn't reliably
# discoverable yet. kotlin-android is applied explicitly instead.
#
# android.builtInKotlin=false alone is not enough: AGP 9's new DSL
# (on by default) exposes only its new, fully-opaque extension types,
# which the classic org.jetbrains.kotlin.android plugin cannot cast to
# the legacy BaseExtension it needs -- confirmed via Google's own AGP 9
# migration doc, not guessed. android.newDsl=false restores the old DSL
# that plugin depends on. Both flags are removed outright in AGP 10.0
# (mid-2026), so this whole opt-out is temporary by design.
android.builtInKotlin=false
android.newDsl=false
